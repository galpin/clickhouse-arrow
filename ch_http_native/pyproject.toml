[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "ch_http_native"
version = "0.1.0"
description = "Minimal Rust HTTP client (ureq-based) for clickhouse-arrow."
requires-python = ">=3.10"

[tool.maturin]
module-name = "ch_http_native._native"
python-source = "python"
features = ["pyo3/extension-module"]
